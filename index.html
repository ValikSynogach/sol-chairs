<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Give a Chair</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Pinyon+Script&family=Unbounded:wght@500;800&display=swap">
<style>
/* Layout: a phone page opened from the QR code. One question, six big squares, one quiet link below. Look taken from the church's fundraiser poster: blue sky, soft clouds at the edges, cream lettering. */
:root {
  color-scheme: dark;
  --bg: #1c120e;
  --cloud: rgba(107, 31, 43, .50);
  --cloud2: rgba(79, 91, 63, .40);
  --panel: #2a1a14;
  --line: #5b3a2e;
  --fg: #eadfce;
  --muted: #c9b7a1;
  --lit: #c98a4d;
  --ink: #1c120e;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --script: "Pinyon Script", "Snell Roundhand", cursive;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(70% 30% at 0% 8%, var(--cloud), transparent 72%),
    radial-gradient(60% 28% at 100% 96%, var(--cloud2), transparent 72%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
header { text-align: center; }
.eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(24px, 7vw, 36px); line-height: 1.1; margin: 8px 0 0; text-wrap: balance; }
.date { font-family: var(--script); font-size: 36px; line-height: 1; margin: 6px 0 0; }
.lead { margin: 0; color: var(--muted); text-align: center; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile {
  aspect-ratio: 1 / 1; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
  color: var(--fg); text-decoration: none; text-align: center;
  transition: border-color .15s ease, background-color .15s ease, color .15s ease;
}
.tile b { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 17vw, 84px); line-height: 1; color: var(--lit); }
.tile:hover b, .tile:active b { color: var(--ink); }
.tile span { font-size: 18px; }
.tile small { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile:hover, .tile:active { border-color: var(--fg); background: var(--fg); color: var(--ink); }
.tile:hover small, .tile:active small { color: var(--ink); }
.tile:focus-visible, .other:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.tile.more b { font-size: clamp(40px, 13vw, 64px); }
.other { align-self: center; color: var(--fg); font-size: 16px; padding: 12px 8px; }
.note { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<main class="wrap">
  <header>
    <p class="eyebrow">SOL Church</p>
    <h1>New Chairs Fundraiser</h1>
    <p class="date">November 29</p>
  </header>
  <p class="lead">How many chairs would you like to give? One chair is $100.</p>

  <nav class="grid" aria-label="Number of chairs">
    <a class="tile" href="https://donate.stripe.com/28EaEW9l8fh14tlfrHb3q0e"><b>1</b><span>chair</span></a>
    <a class="tile" href="https://donate.stripe.com/5kQ28q1SG8SDf7Z3IZb3q0f"><b>2</b><span>chairs</span></a>
    <a class="tile" href="https://donate.stripe.com/8x27sK9l88SDcZRbbrb3q0g"><b>3</b><span>chairs</span></a>
    <a class="tile" href="https://donate.stripe.com/dRmfZg7d07Oze3V7Zfb3q0h"><b>4</b><span>chairs</span></a>
    <a class="tile" href="https://donate.stripe.com/4gMbJ0eFsb0L1h90wNb3q0i"><b>5</b><span>chairs</span></a>
    <a class="tile more" href="https://donate.stripe.com/eVq5kCcxk9WH5xp93jb3q0d"><b>6+</b><span>more chairs</span><small>choose a number</small></a>
  </nav>

  <a class="other" href="https://donate.stripe.com/3cI8wOapcb0L8JBbbrb3q0c">Give a different amount</a>
  <p class="note">Pay by card or Apple Pay through Stripe (SOL Donation).</p>
</main>
</body>
</html>
